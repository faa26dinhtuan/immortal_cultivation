<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanh Khê · Mẫu bản đồ vùng</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #dfddd1; color: #202e27; font: 16px system-ui, sans-serif; }
main { max-width: 740px; margin: auto; background: #f6f2e6; min-height: 100dvh; }
header, section { padding: 20px clamp(16px, 4vw, 30px); }
header { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
small { color: #4e5e52; font-weight: 650; letter-spacing: .06em; }
h1, h2 { font-family: Georgia, serif; margin: 4px 0; }
.map { position: relative; aspect-ratio: 1672 / 941; background: #557466; }
.map img, .map svg { position: absolute; width: 100%; height: 100%; inset: 0; }
.map svg { pointer-events: none; }
button { font: inherit; cursor: pointer; }
.pin { position: absolute; translate: -50% -50%; min-width: 44px; height: 44px; border: 2px solid #f7efdb; border-radius: 50%; background: #243e34; color: white; box-shadow: 0 2px 8px #0006; font-weight: 700; }
.pin[aria-pressed="true"] { background: #874332; }
.pin[data-current="true"] { outline: 3px solid #243e34; outline-offset: 2px; }
.pin { display: grid; place-items: center; padding: 0; width: 44px; }
.pin img, .pin svg { position: static; width: 25px; height: 25px; object-fit: contain; }
button:focus-visible { outline: 3px solid #994823; outline-offset: 4px; }
section { display: grid; gap: 10px; }
p { margin: 0; line-height: 1.55; }
#travel { padding: 12px; min-height: 48px; border: 0; border-radius: 12px; background: #28483a; color: #fff8e7; font-weight: 700; }
#travel:disabled { background: #e1dfd3; color: #4d594f; cursor: default; }
#status { min-height: 1.55em; }
</style>
</head>
<body>
<main>
  <header>
    <div><small>BẢN ĐỒ VÙNG</small><h1>Thanh Khê</h1></div>
    <small id="time">Ngày 1 · 06:00</small>
  </header>
  <div class="map" id="map">
    <img src="exec-da5bdd31-5dd0-4c47-ad59-76f349681f2e.png" alt="Thung lũng nhìn từ trên cao, với các nhánh sông, rừng và dãy núi">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path id="route" fill="none" stroke="#fff2c9" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>
  <section aria-labelledby="destination">
    <small id="current"></small>
    <h2 id="destination"></h2>
    <p id="description"></p>
    <button id="travel" type="button"></button>
    <p id="status" role="status"></p>
  </section>
</main>
<script>
const places = [
  { name: 'Động Phủ', x: 21, y: 55, description: 'Động đá nằm gần lối xuống thung lũng.' },
  { name: 'Bến Hợp Lưu', x: 47, y: 73, description: 'Bãi bồi nơi các nhánh suối gặp nhau.' },
  { name: 'Đèo Vân Nham', x: 77, y: 40, description: 'Lối qua núi men theo khe đá.' },
];
const trails = [
  { from: 0, to: 1, hours: 2, path: 'M21 55 Q23 61 31 61 T40 68 T47 73' },
  { from: 1, to: 2, hours: 4, path: 'M47 73 Q51 74 55 69 T63 62 T70 51 T77 40' },
];
const symbols = [
  '<img src="../assets/icons/starter/cave.png" alt="">',
  '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f7efdb" d="M11 3h2v4h3l4 6H4l4-6h3zm-8 12h18l-3 5H6z"/></svg>',
  '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f7efdb" d="M1 19 7 7l5 9 5-12 6 15h-7l-4 3-4-3z"/></svg>',
];
const byId = id => document.getElementById(id);
let current = 0;
let selected = 1;
let hour = 6;
const pins = places.map((place, index) => {
  const pin = document.createElement('button');
  pin.type = 'button';
  pin.className = 'pin';
  pin.innerHTML = symbols[index];
  pin.title = place.name;
  pin.style.left = place.x + '%';
  pin.style.top = place.y + '%';
  pin.addEventListener('click', () => {
    selected = index;
    byId('status').textContent = '';
    render();
  });
  byId('map').append(pin);
  return pin;
});
function journey() {
  return trails.filter(trail =>
    trail.from >= Math.min(current, selected) && trail.to <= Math.max(current, selected));
}
function render() {
  const legs = journey();
  const hours = legs.reduce((sum, leg) => sum + leg.hours, 0);
  byId('time').textContent = 'Ngày ' + (Math.floor(hour / 24) + 1) + ' · ' +
    String(hour % 24).padStart(2, '0') + ':00';
  byId('current').textContent = 'Đang ở ' + places[current].name;
  byId('destination').textContent = places[selected].name;
  byId('description').textContent = places[selected].description;
  byId('route').setAttribute('d', legs.map(leg => leg.path).join(' '));
  byId('travel').disabled = !hours;
  byId('travel').textContent = hours ? 'Di chuyển · ' + hours + ' giờ' : 'Đang ở đây';
  pins.forEach((pin, index) => {
    pin.dataset.current = String(index === current);
    pin.setAttribute('aria-label', places[index].name + (index === current ? ', vị trí hiện tại' : ''));
    pin.setAttribute('aria-pressed', String(index === selected));
  });
}
byId('travel').addEventListener('click', () => {
  const hours = journey().reduce((sum, leg) => sum + leg.hours, 0);
  hour += hours;
  current = selected;
  render();
  byId('status').textContent = 'Đã đến ' + places[current].name + ' sau ' + hours + ' giờ.';
});
render();
</script>
</body>
</html>
